<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – KAVIRA Indian Handloom Atelier</title>
  <meta name="description" content="Sign in to your KAVIRA patron account to access your saved weaves, order history, and exclusive artisan previews.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ivory: '#F7F3E9',
            beige: '#E6D8C3',
            terracotta: '#B96B4B',
            'terracotta-dark': '#9C5335',
            forest: '#344C3B',
            'forest-dark': '#243529',
            deepbrown: '#49372C',
            gold: '#B89A5A',
            'gold-light': '#D4BC84',
            darkbg: '#15110F',
            darkcard: '#221C18',
            darkborder: '#382C24'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            cormorant: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#FCFBF8] dark:bg-[#15110F] text-[#2C221D] dark:text-[#F5EFE6] min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Minimal Auth Header with Light/Dark and RTL Toggle (NO regular public header) -->
  <header class="py-6 px-6 sm:px-12 flex items-center justify-end">
    <div class="flex items-center gap-3">
      <!-- Light / Dark toggle -->
      <button class="theme-toggle-btn p-2 rounded-full hover:bg-[#E6D8C3]/50 dark:hover:bg-[#251F1B] text-[#B89A5A] transition" title="Toggle Theme">
        <i data-lucide="moon" class="theme-icon-moon w-5 h-5"></i>
        <i data-lucide="sun" class="theme-icon-sun w-5 h-5 hidden"></i>
      </button>

      <!-- RTL toggle (Icon Only) -->
      <button class="rtl-toggle-btn p-2 rounded-full hover:bg-[#E6D8C3]/50 dark:hover:bg-[#251F1B] text-[#49372C] dark:text-[#D1C7BD] transition" title="Toggle RTL / LTR Direction" aria-label="Toggle Text Direction">
        <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Login Main Content Card -->
  <main class="flex-1 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md bg-white dark:bg-[#201A16] rounded-3xl p-8 sm:p-10 border border-[#E6D8C3] dark:border-[#382C24] shadow-2xl relative overflow-hidden">
      
      <!-- Motif top line -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-[#B89A5A] via-[#B96B4B] to-[#344C3B]"></div>

      <!-- Centered Logo + Brand Name Side-by-Side in Card -->
      <div class="flex justify-center mb-6 pt-2">
        <a href="index.html" class="inline-flex items-center gap-3 group">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#B89A5A] to-[#B96B4B] p-0.5 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-[#FCFBF8] dark:bg-[#15110F] rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-[#B96B4B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 3v18M3 12h18M6.5 6.5l11 11M17.5 6.5l-11 11"/>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <span class="font-serif text-2xl font-bold tracking-[0.25em] text-[#2C221D] dark:text-[#F5EFE6]">KAVIRA</span>
            <span class="text-[9px] uppercase tracking-[0.3em] text-[#B89A5A] font-semibold -mt-1">Khadi & Handloom</span>
          </div>
        </a>
      </div>

      <div class="text-center mb-8">
        <span class="text-[10px] uppercase font-bold tracking-[0.25em] text-[#B89A5A]">Welcome Back</span>
        <h1 class="font-serif text-3xl font-bold text-[#2C221D] dark:text-[#F5EFE6] mt-1">Patron Sign In</h1>
        <p class="text-xs text-[#6B5E55] dark:text-[#A89A90] mt-1.5"><bdi>Enter your credentials to access your curated handloom realm.</bdi></p>
      </div>

      <form id="login-form" class="space-y-5">
        <!-- Email -->
        <div>
          <label for="login-email" class="block text-xs font-semibold text-[#49372C] dark:text-[#D1C7BD] mb-1.5"><bdi>Email Address</bdi></label>
          <div class="relative">
            <i data-lucide="mail" class="auth-input-icon w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            <input type="email" id="login-email" required placeholder="patron@domain.com" class="auth-icon-input w-full pl-10 pr-4 py-3 rounded-xl text-xs bg-[#FAF8F5] dark:bg-[#251F1B] border border-[#E6D8C3] dark:border-[#382C24] text-[#2C221D] dark:text-[#F5EFE6] focus:outline-none focus:ring-1 focus:ring-[#B96B4B]" />
          </div>
        </div>

        <!-- Password with Show/Hide -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="text-xs font-semibold text-[#49372C] dark:text-[#D1C7BD]"><bdi>Password</bdi></label>
            <a href="#" onclick="showToast('Password reset link sent to registered email.', 'info'); return false;" class="text-[11px] text-[#B96B4B] hover:underline"><bdi>Forgot Password?</bdi></a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="auth-input-icon w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            <input type="password" id="login-password" required placeholder="••••••••••••" class="w-full pl-10 pr-10 py-3 rounded-xl text-xs bg-[#FAF8F5] dark:bg-[#251F1B] border border-[#E6D8C3] dark:border-[#382C24] text-[#2C221D] dark:text-[#F5EFE6] focus:outline-none focus:ring-1 focus:ring-[#B96B4B]" />
            <button type="button" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 flex items-center justify-center text-gray-400 hover:text-[#B96B4B]" data-target="login-password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between text-xs">
          <label class="auth-checkbox-label flex items-center gap-2.5 text-[#6B5E55] dark:text-[#A89A90] cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 shrink-0 rounded text-[#B96B4B] focus:ring-[#B96B4B] accent-[#B96B4B]" />
            <span><bdi>Remember my session</bdi></span>
          </label>
        </div>

        <!-- Login Button -->
        <button type="submit" class="auth-submit-btn w-full py-3.5 btn-terracotta rounded-xl font-semibold text-xs uppercase tracking-wider shadow-lg flex items-center justify-center gap-2.5">
          <span>Sign In to Account</span>
          <i data-lucide="arrow-right" class="w-4 h-4 shrink-0"></i>
        </button>

        <!-- Social Login Separator -->
        <div class="relative py-2">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#E6D8C3] dark:border-[#382C24]"></div></div>
          <div class="relative flex justify-center text-[10px] uppercase font-bold tracking-wider text-gray-400"><span class="bg-white dark:bg-[#201A16] px-3">Or continue with</span></div>
        </div>

        <!-- Google, Apple & Facebook Icon-only buttons -->
        <div class="auth-social-btns flex items-center justify-center gap-4">
          <!-- Google -->
          <button type="button" onclick="showToast('Authenticating with Google...', 'info')" class="w-12 h-12 rounded-full border border-[#E6D8C3] dark:border-[#382C24] hover:bg-[#FAF8F5] dark:hover:bg-[#251F1B] flex items-center justify-center transition shadow-sm hover:scale-105" title="Sign in with Google">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.24v3.15C3.26 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.24C.45 8.16 0 9.94 0 12s.45 3.84 1.24 5.41l4.04-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.59l4.04 3.15c.95-2.84 3.6-4.99 6.72-4.99z"/>
            </svg>
          </button>

          <!-- Apple -->
          <button type="button" onclick="showToast('Authenticating with Apple...', 'info')" class="w-12 h-12 rounded-full border border-[#E6D8C3] dark:border-[#382C24] hover:bg-[#FAF8F5] dark:hover:bg-[#251F1B] flex items-center justify-center transition shadow-sm hover:scale-105 text-black dark:text-white" title="Sign in with Apple">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.85.94-2.93-.93.04-2.02.63-2.67 1.39-.58.67-1.1 1.76-.96 2.81 1.03.08 2.06-.5 2.69-1.27z"/>
            </svg>
          </button>

          <!-- Facebook -->
          <button type="button" onclick="showToast('Authenticating with Facebook...', 'info')" class="w-12 h-12 rounded-full border border-[#E6D8C3] dark:border-[#382C24] hover:bg-[#FAF8F5] dark:hover:bg-[#251F1B] flex items-center justify-center transition shadow-sm hover:scale-105 text-[#1877F2]" title="Sign in with Facebook">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
        </div>

        <!-- Sign Up Link -->
        <p class="text-center text-xs text-[#6B5E55] dark:text-[#A89A90] pt-4 border-t border-[#E6D8C3]/50 dark:border-[#382C24]">
          <bdi>Don't have a KAVIRA account?</bdi> 
          <a href="signup.html" class="font-bold text-[#B96B4B] hover:underline">Create Account</a>
        </p>
      </form>
    </div>
  </main>



  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
